
# @author Narasimhan M.G. 
# Has been configured to log messages of DEBUG priority and above in a debug log file
# Root Logger Configuration - Revert to a higher level (e.g., ERROR or INFO)
# Only send ERROR messages (and higher) to appender R by default.
# This prevents general system DEBUG messages from flooding our main log.
log4j.rootLogger=ERROR, R

# Appender R: This will be your general log file, primarily for ERRORs from the root.
log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=${catalina.home}/logs/general_errors.log
log4j.appender.R.MaxFileSize=20MB
log4j.appender.R.MaxBackupIndex=10
# Threshold for this appender - it will process messages from its associated loggers at INFO or higher.
# If rootLogger is ERROR, then only ERROR/FATAL from root will go here.
log4j.appender.R.Threshold=INFO 
log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %p %t %c - %m%n

# 2. Define a NEW Appender specifically for your application's debug logs -> narasmg_debug.log
log4j.appender.OMDS_DEBUG_FILE=org.apache.log4j.RollingFileAppender
log4j.appender.OMDS_DEBUG_FILE.File=${catalina.home}/logs/narasmg_debug.log
log4j.appender.OMDS_DEBUG_FILE.MaxFileSize=20MB
log4j.appender.OMDS_DEBUG_FILE.MaxBackupIndex=10
# Threshold for this new appender - ensure it captures DEBUG messages
log4j.appender.OMDS_DEBUG_FILE.Threshold=DEBUG
log4j.appender.OMDS_DEBUG_FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.OMDS_DEBUG_FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %p %t %c - %m%n

# 3. Configure your custom logger to use the NEW Appender at DEBUG level
# This logger will send its output only to the OMDS_DEBUG_FILE appender.
log4j.logger.com.indven=DEBUG, OMDS_DEBUG_FILE

# 4. Catalina Logger Configuration (Optional based on your preference)
# If you want Catalina's DEBUG messages to go to the general_errors.log (R appender)
# you need to make sure R's threshold and the logger's level allow it.
# Or, you can direct it to its own file if you want to separate Catalina logs.

# Option A: Catalina logs go to the general_errors.log (R) if R's threshold allows and rootLogger is not suppressing them
# If rootLogger is ERROR, this line will still make catalina logs appear in R at DEBUG.
log4j.logger.org.apache.catalina=INFO, R

# Option B: Create a separate appender for Catalina (more control)
# log4j.appender.CATALINA=org.apache.log4j.RollingFileAppender
# log4j.appender.CATALINA.File=${catalina.home}/logs/catalina.log
# log4j.appender.CATALINA.MaxFileSize=20MB
# log4j.appender.CATALINA.MaxBackupIndex=5
# log4j.appender.CATALINA.Threshold=INFO # Or DEBUG if you want more verbosity
# log4j.appender.CATALINA.layout=org.apache.log4j.PatternLayout
# log4j.appender.CATALINA.layout.ConversionPattern=%p %t %c - %m%n
# Then use:
# log4j.logger.org.apache.catalina=INFO, CATALINA # Or DEBUG, CATALINA

# 4. Suppress verbose DEBUG messages from specific third-party libraries

# Struts 2 / XWork
# These messages come from 'com.opensymphony.xwork2'. Set their level to INFO or WARN.
log4j.logger.com.opensymphony.xwork2=INFO, R 
log4j.logger.org.apache.struts2=INFO, R     

# FreeMarker
# These messages come from 'freemarker.beans'. Set their level to INFO or WARN.
log4j.logger.freemarker.beans=INFO, R
log4j.logger.freemarker=INFO, R             

# OGNL (Often used with Struts/XWork/FreeMarker)
# Messages like 'ognl.OgnlContext' usually come from 'ognl'.
log4j.logger.ognl=INFO, R

# Common Apache Commons Logging (often verbose)
# If you see logs from other commons libraries, you can suppress them too
log4j.logger.org.apache.commons=INFO, R

# Catalina Logger (adjust as desired)
# Direct Catalina's logs to the general log file (R) at INFO level.
log4j.logger.org.apache.catalina=INFO, R
log4j.logger.org.apache.coyote=INFO, R 
log4j.logger.org.apache.juli=INFO, R   