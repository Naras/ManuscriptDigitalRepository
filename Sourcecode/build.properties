#==================== File and Directory Names ========================

project-name=mdr
builder=mdr
ftp-server=FTP_SERVER_GOES_HERE
ftp-userid=FTP_USERID_GOES_HERE
ftp-password=FTP_PASSWORD_GOES_HERE
tomcat-manager-url=http://localhost:8080/manager
manager.username=tomcat
manager.password=1234


app.name=mdr
app.version=1.0

source.home=./src
test.source.home=./test
lib.home=./WebContent/WEB-INF/lib
#used for Jar files that are needed for compiling
#but should not be part of the war file
#lib.external=./lib_external
webapp.home=./WebContent
resources.home=./resources
build.home=./build
dist.home=./dist
deploy.home=./deploy


#==================== Compilation Control Options =====================

compile.debug=true
compile.deprecation=false
compile.optimize=true




